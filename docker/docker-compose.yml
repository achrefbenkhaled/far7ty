version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: invly
    ports:
      - '5432:5432'
    volumes:
      - invly-postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://user:password@db:5432/invly?schema=public
    depends_on:
      - db

volumes:
  invly-postgres-data:
